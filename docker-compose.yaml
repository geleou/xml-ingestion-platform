name: xml-ingestion
services:
  db:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: ingestion
      POSTGRES_USER: ingestion
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/001-invoices.sql:/docker-entrypoint-initdb.d/001-invoices.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion -d ingestion"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    shm_size: 128mb
secrets:
  db_password:
    file: ./secrets/db_password
volumes:
  postgres_data:
